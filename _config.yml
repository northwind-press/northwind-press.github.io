title: Northwind Press
description: News and in-depth explanation for working engineers on software, development, infrastructure, security, and AI. Every claim sourced.
url: https://northwind-press.github.io
baseurl: ""
lang: en
timezone: UTC
permalink: /:year/:month/:day/:title/
# Merging to main is the publish decision, so never hold back posts by date
# (also guards against build-server clock skew).
future: true
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - HANDOFF.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }
